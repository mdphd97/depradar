name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install DepRadar
      run: |
        python -m pip install --upgrade pip
        pip install -e .

    - name: Test CLI Help & Version
      run: |
        depradar --help

    - name: Test Dependency Scan & HTML Viewer Generation
      run: |
        depradar scan -o test_output.html
        test -f test_output.html
        echo "HTML output successfully generated!"

    - name: Test JSON Graph Export
      run: |
        depradar export -o test_graph.json
        test -f test_graph.json
        python -c "import json; data=json.load(open('test_graph.json')); assert 'nodes' in data and 'links' in data; print('Valid graph JSON!')"

    - name: Test AI Agent Queries & Stale Detection
      run: |
        depradar query python --json
        depradar stale --json
        depradar agent-context
